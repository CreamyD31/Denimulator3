name: Windows build
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: git make
          pacboy: >-
            toolchain:p cmake:p ninja:p python:p spirv-tools:p
            qt6-base:p qt6-multimedia:p qt6-multimedia-wmf:p
            qt6-tools:p qt6-translations:p
      - name: Test preparation safety
        run: python -m unittest discover -s tests -v
      - name: Build, test and package
        run: bash scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Denimulator3-windows-x64
          path: dist/Denimulator3-windows-x64.zip
          if-no-files-found: error
